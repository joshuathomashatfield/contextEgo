[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "procedural-context-windows"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1", "opencv-python>=4.8", "PyYAML>=6", "matplotlib>=3.7"]
[project.optional-dependencies]
vision = ["transformers>=4.40,<5", "Pillow>=10"]
dev = ["pytest>=8"]
[project.scripts]
pcw = "pcw.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
